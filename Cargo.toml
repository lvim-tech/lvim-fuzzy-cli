[package]
name = "lvim-fuzzy-cli"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Fuzzy finder for the terminal, fzf compatible, built on the lvim-fuzzy matcher"
repository = "https://github.com/lvim-tech/lvim-fuzzy-cli"
rust-version = "1.85"

[[bin]]
name = "lvim-fuzzy"
path = "src/main.rs"

[dependencies]
# the search engine (a path until lvim-fuzzy-core is tagged; then git + tag)
lvim-fuzzy-core = { path = "../lvim-fuzzy-core" }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
rayon = "1.12"
regex = "1.12"
rmpv = "1.3"
toml = "0.9"
libc = "0.2"
memchr = "2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
